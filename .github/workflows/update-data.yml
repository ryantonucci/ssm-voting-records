name: Update council data

# Checks the city's site for newly posted minutes every morning, rebuilds
# web/public/data.json, and commits it if anything changed. That push is what
# triggers a Vercel redeploy.
on:
  schedule:
    - cron: "0 11 * * *" # 06:00 Eastern (07:00 during DST)
  workflow_dispatch:
    inputs:
      allow_regression:
        description: "Publish even if final data changed vs. the committed data.json (after reviewing why)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A cold run (no cached PDFs) downloads ~600 MB and parses every meeting,
    # which took over 45 minutes; warm runs are much shorter.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # pdfs/ is gitignored (~600 MB), so keep it between runs in the Actions
      # cache; the download script then only fetches what's new. If the cache
      # has been evicted, the first run just re-downloads everything.
      - uses: actions/cache/restore@v4
        with:
          path: pdfs
          key: pdfs-${{ github.run_id }}
          restore-keys: pdfs-

      # Download first and cache the PDFs straight away, so a later failure or
      # timeout in parsing doesn't throw away the download.
      - run: python3 1_download_minutes.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pdfs
          key: pdfs-${{ hashFiles('pdfs/**') }}

      - run: ./update_data.sh

      # Quality gate. Nothing is committed (so the live site keeps the last
      # good data) unless the new data passes all three checks; a failure
      # fails the job, which makes GitHub email the owner. All three always
      # run so the log shows every problem at once:
      #   - tests/test_gold.py: hand-verified meetings must parse exactly
      #   - audit_minutes.py: invariant checks; only flags not listed in
      #     audit_allowlist.json (known quirks of the source PDFs) fail
      #   - check_regression.py: final meetings may not vanish or change
      #     versus the committed data.json (re-run manually with
      #     allow_regression to accept a reviewed, intended change)
      - name: Check data before publishing
        env:
          ALLOW_DATA_REGRESSION: ${{ inputs.allow_regression && '1' || '' }}
        run: |
          status=0
          echo "::group::Gold-set test"; python3 tests/test_gold.py || status=1; echo "::endgroup::"
          echo "::group::Invariant audit"; python3 audit_minutes.py --json audit_report.json || status=1; echo "::endgroup::"
          echo "::group::Regression check"; python3 check_regression.py || status=1; echo "::endgroup::"
          if [ "$status" != 0 ]; then
            echo "::error::Data checks failed -- data.json was NOT published. See the log groups above and the audit-report artifact."
          fi
          exit $status

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit_report.json
          if-no-files-found: ignore

      - name: Commit data.json if it changed
        run: |
          if git diff --quiet -- web/public/data.json; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add web/public/data.json
          git commit -m "Update council data ($(date -u +%Y-%m-%d))"
          git push
